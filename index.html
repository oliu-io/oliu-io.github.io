<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollie Liu</title>
  <meta name="description" content="Ollie Liu — reinforcement learning at Reflection AI.">
  <meta property="og:title" content="Ollie Liu">
  <meta property="og:description" content="Reinforcement learning at Reflection AI.">
  <meta property="og:image" content="assets/img/prof_pic_2.jpg">
  <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
  <script>
    // Apply a saved theme before first paint; otherwise CSS follows the system.
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">

  <div class="page">

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/>
      </svg>
    </button>

    <!-- Headline — filled from content/hero.md (front matter) -->
    <header class="hero row" data-hero="hero.md"></header>

    <!-- Design element: a live grid-world value function (gridworld.js).
         Delete this <figure> to remove it. -->
    <figure class="row field">
      <span class="label" aria-hidden="true"></span>
      <canvas id="gridworld" aria-label="Animated grid-world: an agent following a value function toward a goal" role="img"></canvas>
    </figure>

    <!--
      SECTIONS — each one is filled from a file in content/.
      Reorder, delete, or add lines; nothing else needs to change.
        data-src    file in content/
        data-type   about | news | papers | list
        data-limit  (news) items shown before "Show all"
    -->
    <main>
      <section class="row section" id="about"  data-title="About"  data-src="hero.md"         data-type="about"></section>
      <section class="row section" id="news"   data-title="News"   data-src="news.md"         data-type="news" data-limit="5"></section>
      <section class="row section" id="papers" data-title="Papers" data-src="publications.md" data-type="papers"></section>
      <!-- Optional sections (uncomment to show):
      <section class="row section" id="experience" data-title="Experience" data-src="experience.md" data-type="list"></section>
      <section class="row section" id="education"  data-title="Education"  data-src="education.md"  data-type="list"></section>
      <section class="row section" id="teaching"   data-title="Teaching"   data-src="teaching.md"   data-type="list"></section>
      <section class="row section" id="awards"     data-title="Awards"     data-src="awards.md"     data-type="list"></section>
      <section class="row section" id="service"    data-title="Service"    data-src="service.md"    data-type="list"></section>
      -->
    </main>

    <footer class="row footer">
      <span class="label"></span>
      <div class="footer-inner">
        <span>&copy; <span id="year">2026</span> Ollie Liu</span>
        <a href="#top">Back to top &uarr;</a>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
  <script src="gridworld.js"></script>
</body>
</html>
